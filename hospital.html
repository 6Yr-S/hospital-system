<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>慧康云医院线上管理系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#111827;--muted:#56645c;--line:#c8d2cb;--bg:#e9ede9;
  --brand:#0f6b3d;--brand-d:#0a4f2c;
  --ok:#0a7a35;--warn:#b45309;--danger:#c0271f;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
  background:var(--bg);color:var(--ink);font-size:13.5px;-webkit-font-smoothing:antialiased}
.app{display:flex;height:100vh;overflow:hidden}

/* ---------- 侧边栏 ---------- */
.sidebar{width:216px;background:#10261a;color:#c5d8cc;display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid #0a1810}
.logo{padding:16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.1)}
.logo .mark{width:32px;height:32px;background:var(--brand);
  display:grid;place-items:center;color:#fff;font-size:16px;font-weight:700;flex-shrink:0}
.logo-t{color:#fff;font-weight:700;font-size:15px;letter-spacing:.5px}
.logo-s{font-size:11px;color:#7fa78c;margin-top:3px;letter-spacing:.5px}
.role-strip{padding:8px 16px;font-size:11px;color:#fff;background:rgba(255,255,255,.06);
  border-bottom:1px solid rgba(255,255,255,.08);letter-spacing:1px}
.nav{flex:1;overflow-y:auto;padding:10px 8px}
.nav-item{display:flex;gap:10px;align-items:center;padding:9px 10px;cursor:pointer;
  color:#c5d8cc;font-size:13.5px;margin-bottom:2px;user-select:none;
  border-left:3px solid transparent}
.nav-item:hover{color:#fff}
.nav-item.active{background:var(--brand);color:#fff;font-weight:600;border-left-color:#6fcf9a}
.nav-item .ico{width:20px;height:20px;background:rgba(255,255,255,.12);
  display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0;font-style:normal}
.nav-item.active .ico{background:rgba(255,255,255,.24)}
.side-foot{padding:12px 16px;font-size:11px;color:#6f8f7a;border-top:1px solid rgba(255,255,255,.1);line-height:1.7}

/* ---------- 主区 ---------- */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
  padding:0 20px;gap:16px;justify-content:space-between;flex-shrink:0}
.crumb{font-weight:700;font-size:15px;letter-spacing:.3px}
.top-right{display:flex;align-items:center;gap:14px}
.clock{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.role-sel{border:1px solid var(--line);background:#f4f8f5;padding:6px 10px;
  font-size:13px;color:var(--ink);outline:none;cursor:pointer;font-family:inherit;font-weight:600}
.role-sel:focus{border-color:var(--brand)}
.user{display:flex;align-items:center;gap:9px}
.avatar{width:34px;height:34px;background:var(--brand);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.u-name{font-size:13px;font-weight:700}
.u-role{font-size:11px;color:var(--muted);margin-top:2px}
#view{flex:1;overflow-y:auto;padding:20px}

/* ---------- 通用组件 ---------- */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.page-head h2{font-size:19px;letter-spacing:.2px;font-weight:700}
.page-head p{font-size:12.5px;color:var(--muted);margin-top:5px}
.card{background:#fff;border:1px solid var(--line);padding:16px}
.card+.card{margin-top:16px}
.card-h{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;margin-bottom:14px}
.card-h::before{content:'';width:3px;height:14px;background:var(--brand);flex-shrink:0}
.card-h .spacer{flex:1}
.muted{color:var(--muted);font-weight:400;font-size:12.5px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.split{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}

.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;
  cursor:pointer;font-size:13px;font-family:inherit;white-space:nowrap;font-weight:500}
.btn:hover{border-color:#8fae9a}
.btn-primary{background:var(--brand);color:#fff;border:1px solid var(--brand);font-weight:600}
.btn-primary:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn-sm{padding:5px 11px;font-size:12.5px}
.btn-ghost{background:#f2f7f3}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-danger{color:var(--danger);border-color:#e3b3ae}
.btn-danger:hover{background:#fdf2f1;border-color:var(--danger)}

.badge{display:inline-block;background:#e0efe6;color:var(--brand);padding:1px 8px;
  font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.t-ok{background:#dff2e6;color:var(--ok)}
.t-warn{background:#fbeedb;color:var(--warn)}
.t-danger{background:#fbe0de;color:var(--danger)}
.t-info{background:#e0efe6;color:var(--brand)}
.t-gray{background:#e9ede9;color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:12px;padding:9px 10px;
  background:#f3f7f3;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.2px}
td{padding:11px 10px;border-bottom:1px solid #eaf1ea;vertical-align:middle}
tbody tr:hover{background:#f4faf5}
tbody tr:last-child td{border-bottom:none}
td b{font-variant-numeric:tabular-nums}

.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:700}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);
  padding:9px 11px;font-size:13px;font-family:inherit;color:var(--ink);outline:none;background:#fbfdfb}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);background:#fff}
.field textarea{resize:vertical;min-height:62px;line-height:1.6}

/* ---------- 工作台 ---------- */
.kpi{background:#fff;border:1px solid var(--line);padding:15px 16px}
.kpi-l{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px}
.kpi-v{font-size:26px;font-weight:700;margin:8px 0 2px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi-v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi-sub{font-size:11.5px;color:var(--muted)}
.bar{height:6px;background:#e4ece5;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flow-node{flex:1;min-width:110px;background:#f4f8f4;border:1px solid var(--line);
  padding:12px;text-align:center}
.flow-node b{display:block;font-size:19px;color:var(--brand);font-variant-numeric:tabular-nums}
.flow-node span{font-size:12px;color:var(--muted)}
.flow-arrow{color:#a8b8ae;font-size:15px}

/* ---------- 预约挂号 ---------- */
.stepbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.step{flex:1;min-width:130px;background:#fff;border:1px solid var(--line);padding:10px 14px;
  font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.step b{width:20px;height:20px;background:#e8efe9;color:#84968a;
  display:grid;place-items:center;font-size:11.5px;flex-shrink:0}
.step.done{border-color:var(--brand);background:#f1f8f3;color:var(--brand);font-weight:700}
.step.done b{background:var(--brand);color:#fff}
.dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.dept{border:1.5px solid var(--line);padding:14px 8px;text-align:center;cursor:pointer;background:#fbfdfb}
.dept:hover{border-color:#8fae9a;background:#f4faf5}
.dept.sel{border-color:var(--brand);background:#e8f4ec}
.dept .ico{width:26px;height:26px;background:#e0efe6;color:var(--brand);
  display:grid;place-items:center;font-size:13px;font-weight:700;margin:0 auto 8px}
.dept.sel .ico{background:var(--brand);color:#fff}
.dept .nm{font-size:13px;font-weight:700}
.doc{border:1.5px solid var(--line);padding:12px 14px;display:flex;gap:12px;align-items:center;
  cursor:pointer;margin-bottom:10px;background:#fbfdfb}
.doc:hover{border-color:#8fae9a;background:#f4faf5}
.doc.sel{border-color:var(--brand);background:#e8f4ec}
.doc .av{width:42px;height:42px;background:var(--brand);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0}
.doc .dname{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.doc .dinfo{font-size:12px;color:var(--muted);margin-top:4px}
.doc .dright{margin-left:auto;text-align:right}
.doc .fee{color:var(--danger);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.doc .fee small{font-size:11px;font-weight:400;color:var(--muted)}
.date-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.date-tab{border:1.5px solid var(--line);padding:8px 14px;font-size:13px;
  cursor:pointer;background:#fbfdfb}
.date-tab:hover{border-color:#8fae9a}
.date-tab.sel{border-color:var(--brand);background:#e8f4ec;color:var(--brand);font-weight:700}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px}
.slot{border:1.5px solid var(--line);padding:9px 6px;background:#fbfdfb;cursor:pointer;
  font-family:inherit;text-align:center;color:var(--ink)}
.slot b{display:block;font-size:12.5px;font-variant-numeric:tabular-nums}
.slot span{font-size:11px;color:var(--muted)}
.slot:hover:not(:disabled){border-color:#8fae9a;background:#f4faf5}
.slot.sel{border-color:var(--brand);background:#e8f4ec}
.slot:disabled{opacity:.45;cursor:not-allowed;background:#eef2ee}
.summary{background:#f4f9f5;border:1px solid var(--line);padding:14px}
.summary .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:13px;border-bottom:1px dashed #d6e3d8}
.summary .row:last-of-type{border-bottom:none}
.summary .row b{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.total{font-size:20px;color:var(--danger);font-weight:700}
.success{text-align:center;padding:38px 20px;max-width:560px;margin:0 auto}
.success .check{width:56px;height:56px;background:var(--ok);
  color:#fff;font-size:30px;display:grid;place-items:center;margin:0 auto 16px}
.success h3{font-size:19px;margin-bottom:8px}
.health-code{display:flex;gap:16px;align-items:center;justify-content:center;background:#f4f9f5;
  border:1px dashed #c6d8ca;padding:16px;margin:20px 0}
.qr{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;width:112px;height:112px;background:#fff;
  padding:6px;border:1px solid var(--line)}
.qr i{display:block;background:#10261a}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.5px;
  color:var(--brand);font-weight:700}

/* ---------- 医生站 ---------- */
.queue-list{max-height:520px;overflow-y:auto;margin:-4px}
.q-item{display:flex;gap:10px;align-items:center;padding:11px 10px;cursor:pointer;
  margin-bottom:3px;border-left:3px solid transparent}
.q-item:hover{background:#f2f8f3}
.q-item.active{background:#e8f4ec;border-left-color:var(--brand)}
.q-no{width:38px;height:38px;background:#e0efe6;color:var(--brand);display:grid;
  place-items:center;font-weight:700;font-size:12px;flex-shrink:0;font-variant-numeric:tabular-nums}
.q-item.active .q-no{background:var(--brand);color:#fff}
.q-info{flex:1;min-width:0}
.q-name{font-weight:700;font-size:13.5px}
.q-name .muted{margin-left:5px;font-size:11.5px}
.q-sym{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.patient-hd{display:flex;gap:14px;align-items:center;background:#f4f9f5;border:1px solid var(--line);
  padding:13px 16px;margin-bottom:16px;flex-wrap:wrap}
.patient-hd .pn{font-size:16px;font-weight:700}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.chk{border:1.5px solid var(--line);padding:8px 11px;font-size:12.5px;cursor:pointer;
  display:flex;gap:8px;align-items:center;background:#fbfdfb;user-select:none}
.chk:hover{border-color:#8fae9a;background:#f4faf5}
.chk.on{border-color:var(--brand);background:#e8f4ec;color:var(--brand);font-weight:700}
.chk .box{width:15px;height:15px;border:1.5px solid #b5c8ba;display:grid;
  place-items:center;font-size:10px;color:#fff;flex-shrink:0;background:#fff}
.chk.on .box{background:var(--brand);border-color:var(--brand)}
.chk .pr{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.alert{padding:10px 13px;font-size:12.5px;margin-bottom:8px;display:flex;gap:8px;
  line-height:1.6;border-left-width:3px;border-left-style:solid}
.alert-danger{background:#fdf2f1;color:#8f1e18;border:1px solid #eec4c0;border-left-color:var(--danger)}
.alert-warn{background:#fdf6ea;color:#7d3d05;border:1px solid #efdcb8;border-left-color:var(--warn)}
.alert-ok{background:#eef8f2;color:#075c28;border:1px solid #bfe3ce;border-left-color:var(--ok)}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}

/* ---------- 图表 ---------- */
.chart{display:flex;align-items:flex-end;gap:14px;height:190px;padding-top:22px}
.chart-item{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:7px}
.chart-bar{background:var(--brand);position:relative;min-height:6px}
.chart-bar span{position:absolute;top:-19px;left:0;right:0;text-align:center;font-size:11px;
  color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.chart-lbl{text-align:center;font-size:11.5px;color:var(--muted)}
.stack{display:flex;height:26px;overflow:hidden;margin:14px 0 10px}
.stack i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend em{display:inline-block;width:10px;height:10px;margin-right:5px}

/* ---------- 弹窗 / Toast ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(10,26,16,.55);display:grid;place-items:center;
  z-index:900;padding:20px}
.modal{background:#fff;padding:22px;width:min(520px,100%);max-height:86vh;overflow-y:auto;border:1px solid var(--line)}
.modal h3{font-size:16px;margin-bottom:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
#toasts{position:fixed;top:16px;right:16px;z-index:1000;display:flex;flex-direction:column;gap:9px}
.toast{background:#fff;padding:11px 16px;font-size:13px;display:flex;gap:9px;align-items:center;
  border:1px solid var(--line);border-left:4px solid var(--ok);max-width:360px}
.toast.warn{border-left-color:var(--warn)}
.toast.err{border-left-color:var(--danger)}
.toast span{width:18px;height:18px;background:var(--ok);color:#fff;display:grid;
  place-items:center;font-size:11px;flex-shrink:0}
.toast.warn span{background:var(--warn)}
.toast.err span{background:var(--danger)}

/* ---------- 响应式 ---------- */
@media(max-width:1100px){
  .split{grid-template-columns:1fr}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  .sidebar{width:64px}
  .logo-t,.logo-s,.side-foot,.role-strip,.nav-item span.lbl{display:none}
  .nav-item{justify-content:center;padding:12px 0;border-left-width:2px}
  .logo{justify-content:center}
  .grid-2{grid-template-columns:1fr}
  .grid-4,.grid-3{grid-template-columns:1fr}
  .clock,.u-name,.u-role{display:none}
}
</style>
</head>
<body>
<div class="app" id="appRoot">
  <aside class="sidebar">
    <div class="logo">
      <span class="mark">✚</span>
      <div><div class="logo-t">慧康云医院</div><div class="logo-s">线上管理系统</div></div>
    </div>
    <div class="role-strip" id="roleStrip">医生视角</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">等保 3 级 · 国密 SM2/SM3/SM4<br>WS 445-2014 · 医保 2.0</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb">工作台</div>
      <div class="top-right">
        <div class="clock" id="clock"></div>
        <button class="btn btn-sm" id="logoutBtn" style="padding:6px 14px">退出登录</button>
        <div class="user">
          <div class="avatar" id="uAvatar">张</div>
          <div><div class="u-name" id="uName">张伟</div><div class="u-role" id="uRole">主任医师 · 内科</div></div>
        </div>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="loginRoot" class="login-root">
  <div class="login-card">
    <div class="login-head">
      <div class="mark">✚</div>
      <h1>慧康云医院 · 线上管理系统</h1>
      <p>统一登录 · 患者 / 医生 / 护士 / 药师 / 医保 / 管理员</p>
    </div>
    <div class="login-body">
      <div id="loginBox">
      <div class="field"><label>身份</label>
        <select id="loginRole">
          <option value="">— 请选择身份 —</option>
          <option>患者</option><option>医生</option><option>护士</option>
          <option>药师</option><option>医保人员</option><option>系统管理员</option>
        </select>
      </div>
      <div class="field"><label>账号 / 姓名</label><input id="loginUser" placeholder="请输入账号或姓名" autocomplete="username"></div>
      <div class="field"><label>密码</label><input id="loginPass" type="password" placeholder="请输入密码" autocomplete="current-password"></div>
      <button class="btn btn-primary" id="loginBtn" style="width:100%;padding:10px">登 录</button>
      <p class="reg-switch">没有账号？<a id="toReg" onclick="showReg()">注册新账号</a></p>
      </div>
      <div id="regBox" style="display:none">
        <div class="field"><label>身份</label>
          <select id="regRole">
            <option value="">— 请选择身份 —</option>
            <option>患者</option><option>医生</option><option>护士</option>
            <option>药师</option><option>医保人员</option><option>系统管理员</option>
          </select>
        </div>
        <div class="field"><label>姓名</label><input id="regName" placeholder="请输入姓名" autocomplete="off"></div>
        <div class="field"><label>账号</label><input id="regUser" placeholder="留空则自动生成" autocomplete="off"></div>
        <div class="field"><label>密码</label><input id="regPass" type="password" placeholder="至少 6 位" autocomplete="new-password"></div>
        <div class="field"><label>确认密码</label><input id="regPass2" type="password" placeholder="再次输入密码" autocomplete="new-password"></div>
        <button class="btn btn-primary" id="regBtn" style="width:100%;padding:10px" onclick="doRegister()">注 册</button>
        <p class="reg-switch">已有账号？<a id="toLogin" onclick="showLogin()">返回登录</a></p>
      </div>
    </div>
  </div>
</div>

<div id="toasts"></div>
<div id="modalRoot"></div>

<style>
#appRoot{display:none}
.login-root{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:50}
.login-card{width:400px;background:#fff;border:1px solid var(--line);box-shadow:0 20px 60px rgba(16,38,26,.18)}
.login-head{background:#10261a;color:#fff;padding:26px 24px;text-align:center}
.login-head .mark{width:52px;height:52px;background:var(--brand);display:grid;place-items:center;font-size:26px;margin:0 auto 12px;color:#fff}
.login-head h1{font-size:19px;letter-spacing:.5px}
.login-head p{font-size:12px;color:#7fa78c;margin-top:6px}
.login-body{padding:24px}

function loadDB() {
  const s = localStorage.getItem(DB_KEY);
  if (!s) { const d = hkSeedData(); localStorage.setItem(DB_KEY, JSON.stringify(d)); return d; }
  try { return JSON.parse(s); }
  catch (e) { const d = hkSeedData(); localStorage.setItem(DB_KEY, JSON.stringify(d)); return d; }
}
function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function getLocalUser() { try { return JSON.parse(localStorage.getItem('hk_user') || 'null'); } catch (e) { return null; } }

/* 本地接口路由（与原后端 server.js 行为一致） */
function localApi(method, path, body) {
  const db = loadDB();
  const u = getLocalUser();
  const col = k => { if (!db[k]) db[k] = []; return db[k]; };
  const P = String(path || '').split('?')[0];
  const b = body || {};
  const NO = msg => ({ ok: false, msg });
  const only = role => (u && u.role === role);
  const logAct = (action, target) => { if (u) db.auditLogs.unshift({ time: nowFull(), user: u.name, role: u.role, action, target, ip: '127.0.0.1' }); };

  /* ----- 登录 / 注册 / 会话 ----- */
  if (P === '/api/login') {
    const q = String(b.username || '').trim();
    if (!q) return NO('请输入账号或姓名');
    const x = db.users.find(v => v.username === q || v.name === q);
    if (!x || String(b.password || '') !== String(x.pwd)) return NO('账号或密码错误');
    return { ok: true, token: 'local-' + Date.now(), user: { username: x.username, name: x.name, role: x.role, profile: x.profile } };
  }
  if (P === '/api/register') {
    if (!ROLES_ALL.includes(b.role)) return NO('请选择有效身份');
    const nm = String(b.name || '').trim();
    if (!nm) return NO('请输入姓名');
    if (!b.password || String(b.password).length < 6) return NO('密码至少 6 位');
    let uname = String(b.username || '').trim();
    if (uname && db.users.some(v => v.username.toLowerCase() === uname.toLowerCase())) return NO('该账号已被占用，请换一个');
    if (db.users.some(v => v.name === nm)) return NO('该姓名已被注册，请换一个');
    if (!uname) { let i = 1; while (db.users.some(v => v.username === 'user' + i)) i++; uname = 'user' + i; }
    db.users.push({ username: uname, name: nm, role: b.role, pwd: String(b.password), profile: { desc: b.role, avatar: nm[0] } });
    saveDB(db);
    return { ok: true, msg: '注册成功', username: uname, name: nm, role: b.role };
  }
  if (P === '/api/me') {
    if (!u) return NO('未登录，请先登录');
    const x = db.users.find(v => v.username === u.username);
    if (!x) return NO('用户不存在');
    return { ok: true, user: { username: x.username, name: x.name, role: x.role, profile: x.profile } };
  }

  /* ----- 按角色返回数据（与原后端一致） ----- */
  if (P === '/api/data') {
    if (!u) return NO('未登录，请先登录');
    const d = {}; const pid = u.username; const nm = u.name;
    if (u.role === '医生') {
      d.queue = col('queue').filter(x => x.doctor === nm);

      d.records = col('records').filter(x => x.doctor === nm);

          '药师': db.users.filter(x => x.role === '药师').length,
          '医保人员': db.users.filter(x => x.role === '医保人员').length,
          '系统管理员': db.users.filter(x => x.role === '系统管理员').length
        }

    } else return NO('无权限访问该角色数据');
    return { ok: true, data: d };
  }

  /* ----- 医生：提交病历（生成处方 + 费用单 + 病历） ----- */
  if (P === '/api/emr') {
    if (!only('医生')) return NO('无权限');
    const q = col('queue').find(x => x.id === b.patientId);
    if (!q) return NO('患者不存在');
    if (b.drugs && b.drugs.length) {
      const items = b.drugs.map(id => {
        const dr = db.drugs.find(x => x.id === id) || {};
        return { name: dr.name, spec: dr.spec, price: dr.price, qty: 1 };
      });
      col('prescriptions').unshift({ id: 'RX' + Date.now().toString().slice(-9), patient: q.name, patientId: q.patientId, doctor: u.name, doctorUser: u.username, time: nowTime(), status: '待审核', items });
    }
    const drugAmt = (b.drugs || []).reduce((s, id) => { const dr = db.drugs.find(x => x.id === id); return s + (dr ? dr.price : 0); }, 0);
    const labAmt = (b.labs || []).length * 45 + (b.exams || []).length * 160;
    const total = +(drugAmt + labAmt).toFixed(2);
    if (total > 0) col('bills').unshift({ id: 'B' + Date.now().toString().slice(-9), patient: q.name, patientId: q.patientId, total, ins: +(total * 0.7).toFixed(2), self: +(total * 0.3).toFixed(2), status: '待上传' });
    col('records').unshift({ id: 'EMR' + Date.now().toString().slice(-9), patient: q.name, patientId: q.patientId, sex: q.sex, age: q.age, dept: q.dept, doctor: u.name, complaint: b.complaint, diagnosis: b.diagnosis, time: nowFull(), version: 'v1.0', status: '已归档' });
    q.status = '已接诊';
    col('messages').unshift({ id: Date.now(), type: '待办', title: q.name + ' 的处方已流转至药房', time: nowTime(), read: false });
    logAct('提交病历归档', 'EMR');
    saveDB(db);
    return { ok: true, msg: '病历已归档，处方与费用单已流转' };
  }
  if (P === '/api/messages/read-all') {
    if (!only('医生')) return NO('无权限');
    col('messages').forEach(m => m.read = true);
    saveDB(db); return { ok: true };
  }

  /* ----- 护士 ----- */
  if (P.startsWith('/api/nurse/verify/')) {
    if (!only('护士')) return NO('无权限');
    const t = col('nurseTasks').find(x => x.id === P.split('/').pop());
    if (!t) return NO('任务不存在');
    t.status = '已核对'; logAct('扫码核对执行', t.id); saveDB(db); return { ok: true };
  }
  if (P.startsWith('/api/nurse/exec/')) {
    if (!only('护士')) return NO('无权限');
    const t = col('nurseTasks').find(x => x.id === P.split('/').pop());
    if (!t) return NO('任务不存在');
    t.status = '已执行'; t.execTime = b.execTime || nowTime(); t.sign = b.sign || u.name;
    logAct('医嘱执行', t.id); saveDB(db); return { ok: true };
  }
  if (P === '/api/adverse') {
    if (!only('护士')) return NO('无权限');
    col('adverse').unshift({ time: nowFull(), patient: b.patient || '未知患者', type: b.type || '其他', desc: b.desc || '（未填写描述）', reporter: u.name });
    logAct('不良事件上报', 'ADV'); saveDB(db); return { ok: true };
  }
  if (P === '/api/rounds') {
    if (!only('护士')) return NO('无权限');
    const pt = col('patients').find(x => x.bed === b.bed);
    col('rounds').unshift({ time: nowTime(), bed: b.bed, patient: b.patient, level: pt ? pt.level : '二级护理', note: b.note || '（未填写巡视记录）', nurse: u.name });
    logAct('新增巡视记录', 'ROUND'); saveDB(db); return { ok: true };
  }

  /* ----- 药师 ----- */
  if (P.startsWith('/api/rx/')) {
    if (!only('药师')) return NO('无权限');
    const x = col('prescriptions').find(v => v.id === P.split('/')[3]);
    if (!x) return NO('处方不存在');
    if (P.endsWith('/pass')) x.status = '已审核';
    else if (P.endsWith('/dispense')) {
      x.status = '已发药';
      x.items.forEach(i => { const s = col('stock').find(v => v.name === i.name); if (s) s.qty = Math.max(0, s.qty - i.qty * 10); });
    } else if (P.endsWith('/reject') || P.endsWith('/return')) x.status = '已退回';
    else return NO('未知操作');
    logAct('处方处理 ' + x.status, x.id); saveDB(db); return { ok: true };
  }
  if (P.startsWith('/api/consult/')) {
    if (!only('药师')) return NO('无权限');
    const c = col('consults').find(x => x.id === P.split('/')[3]);
    if (!c) return NO('咨询不存在');
    c.status = '已回复'; c.reply = b.reply || '';
    logAct('回复用药咨询', c.id); saveDB(db); return { ok: true };
  }

  /* ----- 医保人员 ----- */
  if (P.startsWith('/api/bill/')) {
    if (!only('医保人员')) return NO('无权限');
    const bill = col('bills').find(x => x.id === P.split('/')[3]);
    if (!bill) return NO('账单不存在');
    if (P.endsWith('/upload')) bill.status = '已上传';
    else if (P.endsWith('/audit')) bill.status = '已审核';
    else if (P.endsWith('/settle')) bill.status = '已结算';
    else return NO('未知操作');
    logAct('医保结算 ' + bill.status, bill.id); saveDB(db); return { ok: true };
  }
  if (P.startsWith('/api/catalog/')) {
    if (!only('医保人员')) return NO('无权限');
    const c = col('catalog').find(x => x.code === P.split('/')[3]);
    if (!c) return NO('目录不存在');
    c.status = c.status === '启用' ? '停用' : '启用';
    logAct('目录状态切换', c.code); saveDB(db); return { ok: true, status: c.status };
  }
  if (P.startsWith('/api/anomaly/')) {
    if (!only('医保人员')) return NO('无权限');
    const a = col('anomalies').find(x => x.id === P.split('/')[3]);
    if (!a) return NO('异常不存在');
    a.status = P.endsWith('/pass') ? '已通过' : '已驳回';
    saveDB(db); return { ok: true };
  }

  /* ----- 患者 ----- */
  if (P === '/api/booking') {
    if (!only('患者')) return NO('无权限');
    const doc = db.doctors.find(x => x.id === b.doctorId);
    const dep = db.departments.find(x => x.id === b.deptId);
    if (!doc || !dep || !b.slot) return NO('请选择医生与就诊时段');
    const appt = { id: 'APT' + Date.now().toString().slice(-5), patientId: u.username, dept: dep.name, doctor: doc.name, date: b.dateLabel, slot: b.slot, fee: doc.fee, status: '待就诊' };
    col('patientAppts').unshift(appt);
    col('queue').push({ id: 'P' + Date.now().toString(36), no: 'A' + (col('queue').length + 1), name: u.name, sex: '男', age: 30, dept: dep.name, doctor: doc.name, symptom: '（患者自述）新预约患者，待接诊', status: '候诊', patientId: u.username });

  }
  if (P.startsWith('/api/appt/')) {
    if (!only('患者')) return NO('无权限');
    const a = col('patientAppts').find(x => x.id === P.split('/')[3] && x.patientId === u.username);
    if (!a) return NO('预约不存在');
    a.status = '已取消'; saveDB(db); return { ok: true };
  }
  if (P.startsWith('/api/paybill/')) {
    if (!only('患者')) return NO('无权限');
    const bl = col('patientBills').find(x => x.id === P.split('/').pop() && x.patientId === u.username);
    if (!bl) return NO('账单不存在');
    bl.status = '已支付'; saveDB(db); return { ok: true };
  }
  if (P === '/api/pmessages/read-all') {
    if (!only('患者')) return NO('无权限');
    col('patientMessages').filter(x => x.patientId === u.username).forEach(m => m.read = true);
    saveDB(db); return { ok: true };
  }

  /* ----- 系统管理员 ----- */
  if (P === '/api/backup') {
    if (!only('系统管理员')) return NO('无权限');
    col('backups').unshift({ time: nowTime(), type: '手动全量备份', size: '249 GB', location: '本地 + 异地云', status: '成功' });
    logAct('手动全量备份', 'BACKUP'); saveDB(db); return { ok: true };
  }
  if (P === '/api/refresh-api') {
    if (!only('系统管理员')) return NO('无权限');
    col('apiLogs').forEach(a => { a.calls += Math.floor(Math.random() * 30); });
    saveDB(db); return { ok: true };
  }

  return NO('未知接口：' + P);
}

/* 统一入口：所有原有代码调用 api() 的地方不用改，内部走本地数据层 */
async function api(method, path, body) { return localApi(method, path, body); }

/* 从后端加载当前角色数据，写入 state；先清空全部角色集合，实现严格的数据隔离 */
const DATA_KEYS = ['queue','prescriptions','records','results','messages','nurseTasks','patients','rounds','adverse','stock','consults','bills','catalog','anomalies','patientAppts','patientBills','patientMessages','apiLogs','auditLogs','backups'];
async function loadData() {
  const r = await api('GET', '/api/data');
  if (!r.ok) throw new Error(r.msg);
  DATA_KEYS.forEach(k => { state[k] = []; });   // 清空残留，防串数据
  Object.assign(state, r.data);
}

/* 写操作：调后端 -> 落库 -> 重新拉取 -> 渲染 */
async function persist(path, body, msg) {
  const r = await api('POST', path, body);
  if (!r.ok) return toast(r.msg || '操作失败', 'warn');
  await loadData();
  render();
  toast(msg || '操作成功');
}

function enterApp(user) {
  CURRENT_USER = user;
  state.role = user.role;
  state.route = (NAV[user.role] && NAV[user.role][0]) ? NAV[user.role][0].id : 'doc-dashboard';
  $('#loginRoot').style.display = 'none';
  $('#appRoot').style.display = 'flex';
  $('#uName').textContent = user.name;
  $('#uRole').textContent = (user.profile && user.profile.desc) || user.role;
  $('#uAvatar').textContent = (user.profile && user.profile.avatar) || user.name[0];
  renderNav();
  loadData().then(() => { render(); toast('已登录：' + user.role + ' · ' + user.name); })
            .catch(e => toast(e.message, 'warn'));
}

/* 登录 / 注册 切换 */
function showReg() { $('#loginBox').style.display = 'none'; $('#regBox').style.display = 'block'; }
function showLogin() { $('#loginBox').style.display = 'block'; $('#regBox').style.display = 'none'; }
$('#toReg').addEventListener('click', showReg);
$('#toLogin').addEventListener('click', showLogin);

/* 注册新账号 */
async function doRegister() {
  const role = $('#regRole').value;
  if (!role) return toast('请选择身份', 'warn');
  const name = $('#regName').value.trim();
  const username = $('#regUser').value.trim();
  const password = $('#regPass').value;
  const password2 = $('#regPass2').value;
  if (!name) return toast('请输入姓名', 'warn');
  if (!password || password.length < 6) return toast('密码至少 6 位', 'warn');
  if (password !== password2) return toast('两次密码不一致', 'warn');
  const r = await api('POST', '/api/register', { username, name, password, role });
  if (!r.ok) return toast(r.msg || '注册失败', 'warn');
  toast('注册成功，账号：' + r.username, 'ok');
  showLogin();
  $('#loginRole').value = role;
  $('#loginUser').value = r.username;
  $('#loginPass').value = '';
  $('#regUser').value = ''; $('#regName').value = ''; $('#regPass').value = ''; $('#regPass2').value = '';
}
$('#regBtn').addEventListener('click', doRegister);
$('#regPass2').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });

async function doLogin() {
  const role = $('#loginRole').value;
  if (!role) return toast('请先选择身份', 'warn');
  const username = $('#loginUser').value.trim();
  const password = $('#loginPass').value;
  if (!username || !password) return toast('请输入账号和密码', 'warn');
  const r = await api('POST', '/api/login', { username, password });
  if (!r.ok) return toast(r.msg || '登录失败', 'warn');
  if (r.user.role !== role) return toast('该账号不是「' + role + '」，请选择正确身份', 'warn');
  localStorage.setItem('hk_token', r.token);
  localStorage.setItem('hk_user', JSON.stringify(r.user));
  enterApp(r.user);
}

function logout() {
  localStorage.removeItem('hk_token');
  localStorage.removeItem('hk_user');
  CURRENT_USER = null;
  $('#appRoot').style.display = 'none';
  $('#loginRoot').style.display = 'flex';
  $('#loginUser').value = ''; $('#loginPass').value = '';
  toast('已退出登录');
}

/* 启动：有 token 则恢复会话，否则显示登录页 */
async function boot() {
  const token = localStorage.getItem('hk_token');
  if (!token) { $('#loginRoot').style.display = 'flex'; return; }
  const r = await api('GET', '/api/me');
  if (!r.ok) { localStorage.removeItem('hk_token'); $('#loginRoot').style.display = 'flex'; return; }
  enterApp(r.user);
}

function dateLabels() {
  const w = ['周日','周一','周二','周三','周四','周五','周六'];
  return [0,1,2].map(i => {
    const d = new Date(); d.setDate(d.getDate() + i);
    return { key:`${d.getFullYear()}${d.getMonth()+1}${d.getDate()}`,
             label:`${i===0?'今天':i===1?'明天':'后天'} ${d.getMonth()+1}-${d.getDate()} ${w[d.getDay()]}` };
  });
}
function slotRemain(docId, dateKey, slot) {
  let h = 0; const s = docId + dateKey + slot;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1009;
  return h % 4;
}
function getForm(id) {
  if (!state.forms[id]) state.forms[id] = { complaint:'', history:'', diagnosis:'', labs:[], exams:[], drugs:[], submitted:false };
  return state.forms[id];
}
function drugWarnings(ids, patient) {
  const has = id => ids.includes(id);
  const w = [];
  if (has('d3') && has('d2')) w.push({ level:'严重', msg:'华法林钠片 + 阿司匹林肠溶片：显著增加出血风险，建议避免联用' });
  if (has('d3') && has('d4')) w.push({ level:'严重', msg:'华法林钠片 + 布洛芬：NSAIDs 可增强抗凝作用，出血风险升高' });
  if (has('d1') && has('d6')) w.push({ level:'提示', msg:'阿莫西林 + 甲硝唑：注意胃肠道反应与二重感染风险' });
  if (has('d5') && has('d6')) w.push({ level:'提示', msg:'头孢克肟 + 甲硝唑：抗菌谱部分重叠，建议评估联用必要性' });
  if (patient && patient.age >= 65 && has('d4')) w.push({ level:'提示', msg:'老年患者（≥65岁）使用布洛芬需评估肾功能与消化道出血风险' });
  return w;
}
function qrHtml(seed) {
  let h = 7;
  for (const c of seed) h = (h * 33 + c.charCodeAt(0)) % 2147483647;
  let cells = '';
  for (let i = 0; i < 121; i++) {
    h = (h * 1103515245 + 12345) % 2147483648;
    const on = (h >> 9) % 2 === 0;
    cells += `<i style="background:${on ? '#10261a' : '#ffffff'}"></i>`;
  }
  return `<div class="qr">${cells}</div>`;
}
const statusTag = s => {
  const map = {
    '待审核':'t-warn','已审核':'t-info','已发药':'t-ok','已退回':'t-danger',
    '待上传':'t-warn','已上传':'t-info','已结算':'t-ok',
    '待执行':'t-warn','已核对':'t-info','已执行':'t-ok',
    '候诊':'t-warn','已接诊':'t-ok','已归档':'t-ok',
    '待就诊':'t-warn','已完成':'t-ok','已取消':'t-gray',
    '已支付':'t-ok','待支付':'t-warn',
    '待处理':'t-warn','已通过':'t-ok','已驳回':'t-danger',
    '启用':'t-ok','停用':'t-gray',
    '成功':'t-ok','待执行':'t-warn','正常':'t-ok','告警':'t-danger',
  };
  return `<span class="tag ${map[s] || 't-gray'}">${s}</span>`;
};

function viewDocClinic() {
  const queue = state.queue;
  if (!queue.length) return `<div class="card"><div class="card-h">接诊工作台</div><div class="muted">暂无候诊患者</div></div>`;
  if (!queue.find(p => p.id === state.activePatient)) state.activePatient = queue[0].id;
  const p = queue.find(x => x.id === state.activePatient);
  const f = getForm(p.id);
  const warns = drugWarnings(f.drugs, p);
  const hasSevere = warns.some(w => w.level === '严重');

  return `
  <div class="page-head">
    <div><h2>接诊工作台</h2><p>电子病历录入 · 检验检查开单 · 处方开立 · 合理用药预警</p></div>
    <div class="muted">接诊医生：张伟 主任医师 · 内科</div>
  </div>

  <div class="split">
    <div class="card">
      <div class="card-h">候诊队列 <span class="badge">${queue.filter(x => x.status === '候诊').length}</span></div>
      <div class="queue-list">
        ${queue.map(x => `
          <div class="q-item ${x.id === p.id ? 'active' : ''}" data-act="select-patient" data-id="${x.id}">
            <div class="q-no">${x.no}</div>
            <div class="q-info">
              <div class="q-name">${x.name}<span class="muted">${x.sex} · ${x.age}岁</span></div>
              <div class="q-sym">${esc(x.symptom)}</div>
            </div>
            ${statusTag(x.status)}
          </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <div class="patient-hd">
        <div class="avatar" style="width:44px;height:44px;font-size:16px">${p.name[0]}</div>
        <div>
          <div class="pn">${p.name} <span class="muted">${p.sex} · ${p.age}岁 · 病历号 ${p.id}</span></div>
          <div class="muted" style="margin-top:4px">主诉：${esc(p.symptom)}　|　就诊科室：${p.dept}</div>
        </div>
        <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
          <span class="tag t-info">${p.no}</span>
          ${statusTag(p.status)}
        </div>
      </div>

      <div class="card-h" style="margin-bottom:12px">
        电子病历
        <span class="spacer"></span>
        <span class="muted" style="margin-right:6px">引用模板：</span>
        ${Object.entries(TEMPLATES).map(([k, t]) =>
          `<button class="btn btn-sm btn-ghost" data-act="tpl" data-id="${k}" style="margin-left:6px">${t.name}</button>`).join('')}
      </div>

      <div class="grid-2" style="gap:14px">
        <div class="field">
          <label>主诉 <span style="color:var(--danger)">*</span></label>
          <textarea data-form="${p.id}" data-field="complaint" placeholder="例如：发热、咳嗽、咽痛3天">${esc(f.complaint)}</textarea>
        </div>
        <div class="field">
          <label>现病史</label>
          <textarea data-form="${p.id}" data-field="history" placeholder="起病时间、症状演变、诊疗经过">${esc(f.history)}</textarea>
        </div>
      </div>
      <div class="field">
        <label>初步诊断 <span style="color:var(--danger)">*</span></label>
        <input data-form="${p.id}" data-field="diagnosis" value="${esc(f.diagnosis)}" placeholder="例如：急性上呼吸道感染">
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px">
        <div>
          <label style="font-size:12.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:8px">检验开单</label>
          <div class="chk-grid" style="grid-template-columns:1fr 1fr">
            ${LABS.map(l => `
              <div class="chk ${f.labs.includes(l) ? 'on' : ''}" data-act="toggle-lab" data-id="${l}">
                <span class="box">${f.labs.includes(l) ? '✓' : ''}</span>${l}
              </div>`).join('')}
          </div>
        </div>
        <div>
          <label style="font-size:12.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:8px">检查开单</label>
          <div class="chk-grid" style="grid-template-columns:1fr 1fr">
            ${EXAMS.map(l => `
              <div class="chk ${f.exams.includes(l) ? 'on' : ''}" data-act="toggle-exam" data-id="${l}">
                <span class="box">${f.exams.includes(l) ? '✓' : ''}</span>${l}
              </div>`).join('')}
          </div>
        </div>
      </div>

      <div style="margin-top:16px">
        <label style="font-size:12.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:8px">处方开立（西药 / 中成药）</label>
        <div class="chk-grid">
          ${DRUGS.map(d => `
            <div class="chk ${f.drugs.includes(d.id) ? 'on' : ''}" data-act="toggle-drug" data-id="${d.id}">
              <span class="box">${f.drugs.includes(d.id) ? '✓' : ''}</span>
              <span>${d.name}</span>
              <span class="pr">¥${d.price.toFixed(1)}</span>
            </div>`).join('')}
        </div>
      </div>

      <div style="margin-top:14px">
        ${warns.length
          ? warns.map(w => `<div class="alert ${w.level === '严重' ? 'alert-danger' : 'alert-warn'}">
              <b>[${w.level}]</b><span>${w.msg}</span></div>`).join('')
          : '<div class="alert alert-ok"><b>[✓]</b><span>合理用药校验通过，未发现配伍禁忌与剂量异常</span></div>'}
      </div>

      <div class="form-actions">
        <button class="btn" data-act="nav" data-id="doc-emr">查看历史病历</button>
        <button class="btn btn-primary" data-act="submit-emr" ${f.submitted ? 'disabled' : ''}>
          ${f.submitted ? '已提交归档' : (hasSevere ? '存在严重预警，确认后提交' : '提交并归档')}
        </button>
      </div>
    </div>
  </div>`;
}

function viewDocMessages() {
  const unread = state.messages.filter(m => !m.read).length;
  const tagOf = t => t === '危急值' ? 't-danger' : t === '待办' ? 't-warn' : 't-info';
  return `
  <div class="page-head">
    <div><h2>消息中心</h2><p>危急值即时推送 · 待办提醒 · 系统通知</p></div>
    <button class="btn" data-act="read-all">全部标记已读</button>
  </div>
  <div class="card">
    <div class="card-h">消息列表 <span class="badge">${unread} 条未读</span></div>
    ${state.messages.map(m => `
      <div style="display:flex;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px solid #eaf1ea">
        <span class="tag ${tagOf(m.type)}">${m.type}</span>
        <div style="flex:1;font-size:13.5px;${m.read ? 'color:var(--muted)' : 'font-weight:700'}">${esc(m.title)}</div>
        <span class="muted">${m.time}</span>
        ${m.read ? '' : '<span style="width:8px;height:8px;background:var(--danger)"></span>'}
      </div>`).join('')}
  </div>`;
}

function renderNav() {
  const items = NAV[state.role] || [];
  $('#nav').innerHTML = items.map(n => `
    <div class="nav-item ${n.id === state.route ? 'active' : ''}" data-act="nav" data-id="${n.id}">
      <span class="ico">${n.ico}</span><span class="lbl">${n.label}</span>
    </div>`).join('');
}

function render() {
  const fn = VIEWS[state.route] || VIEWS['doc-dashboard'];
  $('#view').innerHTML = fn();
  $('#view').scrollTop = 0;
  $$('#nav .nav-item').forEach(n => n.classList.toggle('active', n.dataset.id === state.route));
  const item = (NAV[state.role] || []).find(n => n.id === state.route);
  $('#crumb').textContent = item ? item.label : '工作台';
  $('#roleStrip').textContent = state.role + '视角';
}

function switchRole(user) {
  state.role = user.role;
  state.route = (NAV[user.role] && NAV[user.role][0]) ? NAV[user.role][0].id : 'doc-dashboard';
  const u = user;
  $('#uName').textContent = u.name;
  $('#uRole').textContent = (u.profile && u.profile.desc) || u.role;
  $('#uAvatar').textContent = (u.profile && u.profile.avatar) || u.name[0];
  renderNav();
  render();
}

/* =========================================================
   交互动作
   ========================================================= */
const ACTIONS = {
  'nav': d => { state.route = d.id; render(); },
  'modal-close': () => closeModal(),

  /* ---- 医生 ---- */
  'select-patient': d => {
    state.activePatient = d.id;
    if (d.goto) state.route = d.goto;
    render();
  },
  'tpl': d => {
    const t = TEMPLATES[d.id];
    const f = getForm(state.activePatient);
    f.complaint = t.complaint; f.history = t.history; f.diagnosis = t.diagnosis;
    f.labs = [...t.labs]; f.exams = [...t.exams]; f.drugs = [...t.drugs];
    toast(`已引用模板：${t.name}`);
    render();
  },
  'toggle-lab': d => {
    const f = getForm(state.activePatient);
    f.labs = f.labs.includes(d.id) ? f.labs.filter(x => x !== d.id) : [...f.labs, d.id];
    render();
  },
  'toggle-exam': d => {
    const f = getForm(state.activePatient);
    f.exams = f.exams.includes(d.id) ? f.exams.filter(x => x !== d.id) : [...f.exams, d.id];
    render();
  },
  'toggle-drug': d => {
    const f = getForm(state.activePatient);
    f.drugs = f.drugs.includes(d.id) ? f.drugs.filter(x => x !== d.id) : [...f.drugs, d.id];
    render();
  },
  'submit-emr': () => {
    const p = state.queue.find(x => x.id === state.activePatient);
    const f = getForm(p.id);
    if (!f.complaint.trim()) return toast('请填写主诉', 'warn');
    if (!f.diagnosis.trim()) return toast('请填写初步诊断', 'warn');
    if (!f.drugs.length && !f.labs.length && !f.exams.length) return toast('请至少开立一项医嘱', 'warn');
    if (f.submitted) return toast('该患者病历已提交', 'warn');

    const warns = drugWarnings(f.drugs, p);
    const severe = warns.some(w => w.level === '严重');
    const doSubmit = async () => {
      f.submitted = true;
      await persist('/api/emr', {
        patientId: p.id, complaint: f.complaint, diagnosis: f.diagnosis,
        labs: f.labs, exams: f.exams, drugs: f.drugs,
      }, '病历已归档，处方与费用单已流转');
    };
    if (severe) {
      openModal(`
        <h3>合理用药严重预警</h3>
        ${warns.map(w => `<div class="alert alert-danger"><b>[${w.level}]</b><span>${w.msg}</span></div>`).join('')}
        <p class="muted" style="margin-top:12px">确认继续提交？系统将记录本次超预警开单行为用于处方点评。</p>
        <div class="modal-actions">
          <button class="btn" data-act="modal-close">返回修改</button>
          <button class="btn btn-primary" data-act="confirm-submit">确认提交</button>
        </div>`);
      ACTIONS['confirm-submit'] = () => { closeModal(); doSubmit(); };
    } else { doSubmit(); }
  },
  'confirm-submit': () => closeModal(),
  'open-record': d => {
    const r = state.records.find(x => x.id === d.id);
    openModal(`
      <h3>病历调阅 · ${r.id}</h3>
      <div class="summary">
        <div class="row"><span>患者</span><b>${r.patient}（${r.sex} · ${r.age}岁）</b></div>
        <div class="row"><span>科室 / 医生</span><b>${r.dept} · ${r.doctor}</b></div>
        <div class="row"><span>主诉</span><b>${esc(r.complaint)}</b></div>
        <div class="row"><span>诊断</span><b>${r.diagnosis}</b></div>
        <div class="row"><span>版本</span><b>${r.version}</b></div>
        <div class="row"><span>归档时间</span><b>${r.time}</b></div>
        <div class="row"><span>加密状态</span><b style="color:var(--ok)">SM4 已加密 · 双副本</b></div>
      </div>
      <p class="muted" style="margin-top:12px">本次访问已记入防篡改审计日志</p>
      <div class="modal-actions"><button class="btn btn-primary" data-act="modal-close">关闭</button></div>`);
  },
  'view-result': d => {
    const r = state.results[+d.idx];
    openModal(`
      <h3>检验检查报告</h3>
      <div class="summary">
        <div class="row"><span>患者</span><b>${r.patient}</b></div>
        <div class="row"><span>项目</span><b>${r.item}</b></div>
        <div class="row"><span>结果值</span><b style="color:${r.level==='危急'?'var(--danger)':r.level==='异常'?'var(--warn)':'var(--ok)'}">${r.value}</b></div>
        <div class="row"><span>参考范围</span><b>${r.ref}</b></div>
        <div class="row"><span>报告时间</span><b>${r.time}</b></div>
        <div class="row"><span>级别</span><b><span class="tag ${tagFor(r.level)}">${r.level}</span></b></div>
      </div>
      <div class="modal-actions"><button class="btn btn-primary" data-act="modal-close">关闭</button></div>`);
  },
  'read-all': () => persist('/api/messages/read-all', {}, '全部消息已标记为已读'),

  /* ---- 护士 ---- */
  'nurse-verify': d => {
    const t = state.nurseTasks.find(x => x.id === d.id);
    openModal(`
      <h3>扫码核对 · ${t.patient} ${t.bed}</h3>
      <div class="field"><label>腕带二维码</label><input value="WRIST-${t.patient}-${t.bed}" readonly></div>
      <div class="field"><label>药品条码</label><input value="DRUG-${t.drug.split(' ')[0]}-${t.time.replace(':','')}" readonly></div>
      <div class="alert alert-ok"><b>[✓]</b><span>患者身份与药品信息匹配成功，双人核对通过</span></div>
      <div class="modal-actions">
        <button class="btn" data-act="modal-close">取消</button>
        <button class="btn btn-primary" data-act="nurse-verify-ok" data-id="${t.id}">核对通过</button>

  },
  'nurse-verify-ok': d => {
    closeModal();
    persist('/api/nurse/verify/' + d.id, {}, '用药核对通过');
  },
  'nurse-exec': d => {
    const t = state.nurseTasks.find(x => x.id === d.id);
    openModal(`
      <h3>执行记录 · ${t.patient} ${t.bed}</h3>
      <div class="field"><label>实际执行时间</label><input id="execTime" value="${nowTime()}"></div>
      <div class="field"><label>实际用量</label><input id="execDose" value="${t.drug}"></div>
      <div class="field"><label>执行护士签名</label><input id="execSign" value="刘芳"></div>
      <div class="modal-actions">
        <button class="btn" data-act="modal-close">取消</button>
        <button class="btn btn-primary" data-act="nurse-exec-ok" data-id="${t.id}">确认执行</button>
      </div>`);
  },
  'nurse-exec-ok': d => {
    closeModal();
    persist('/api/nurse/exec/' + d.id, {
      execTime: ($('#execTime') && $('#execTime').value) || nowTime(),
      sign: ($('#execSign') && $('#execSign').value) || (CURRENT_USER && CURRENT_USER.name) || '',
    }, '医嘱已执行并留痕');
  },
  'nurse-report': () => {
    openModal(`
      <h3>不良事件上报</h3>
      <div class="field"><label>患者</label><input id="advPatient" placeholder="例如：李建国"></div>
      <div class="field"><label>事件类型</label>
        <select id="advType">
          <option>用药差错</option><option>跌倒坠床</option><option>管路滑脱</option>
          <option>标本采集错误</option><option>压疮</option><option>其他</option>
        </select>
      </div>
      <div class="field"><label>事件描述</label><textarea id="advDesc" placeholder="请描述事件经过、后果与已采取措施"></textarea></div>
      <div class="modal-actions">
        <button class="btn" data-act="modal-close">取消</button>
        <button class="btn btn-primary" data-act="report-submit">提交上报</button>
      </div>`);
  },
  'report-submit': () => {
    const patient = ($('#advPatient') && $('#advPatient').value.trim()) || '未知患者';
    const type = $('#advType') ? $('#advType').value : '其他';
    const desc = ($('#advDesc') && $('#advDesc').value.trim()) || '（未填写描述）';
    closeModal();
    persist('/api/adverse', { patient, type, desc }, '不良事件已上报，流程已流转至护理部');
  },
  'round-add': () => {
    openModal(`
      <h3>新增巡视记录</h3>
      <div class="field"><label>床位 / 患者</label>
        <select id="rndPatient">
          ${state.patients.map(p => `<option value="${p.bed}|${p.name}">${p.bed} ${p.name}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>巡视记录</label><textarea id="rndNote" placeholder="生命体征、病情变化、患者主诉等"></textarea></div>
      <div class="modal-actions">
        <button class="btn" data-act="modal-close">取消</button>
        <button class="btn btn-primary" data-act="round-add-ok">提交记录</button>
      </div>`);
  },
  'round-add-ok': () => {
    const sel = $('#rndPatient');
    const [bed, patient] = sel ? sel.value.split('|') : ['未知', '未知'];
    const note = ($('#rndNote') && $('#rndNote').value.trim()) || '（未填写巡视记录）';
    closeModal();
    persist('/api/rounds', { bed, patient, note }, '巡视记录已提交');
  },
  'view-patient': d => {
    const p = state.patients[+d.idx];
    openModal(`
      <h3>患者详情 · ${p.bed}</h3>
      <div class="summary">
        <div class="row"><span>姓名</span><b>${p.name}</b></div>
        <div class="row"><span>性别 / 年龄</span><b>${p.sex} · ${p.age}岁</b></div>
        <div class="row"><span>诊断</span><b>${p.diag}</b></div>
        <div class="row"><span>护理级别</span><b>${p.level}</b></div>
        <div class="row"><span>主管医生</span><b>${p.doctor}</b></div>
      </div>
      <div class="modal-actions"><button class="btn btn-primary" data-act="modal-close">关闭</button></div>`);
  },

  /* ---- 药师 ---- */
  'rx-pass': d => persist('/api/rx/' + d.id + '/pass', {}, `处方 ${d.id} 审核通过`),
  'rx-reject': d => persist('/api/rx/' + d.id + '/reject', {}, `处方 ${d.id} 已退回开单医生`),
  'rx-dispense': d => persist('/api/rx/' + d.id + '/dispense', {}, `处方 ${d.id} 发药完成，库存已自动扣减`),
  'rx-return': d => persist('/api/rx/' + d.id + '/return', {}, `处方 ${d.id} 已退药，库存已回补`),
  'pha-reply': d => {
    const c = state.consults.find(x => x.id === d.id);
    openModal(`
      <h3>回复用药咨询 · ${c.patient}</h3>
      <div class="alert alert-warn"><b>[咨询]</b><span>${esc(c.question)}</span></div>
      <div class="field"><label>回复内容</label><textarea id="replyText" placeholder="请给出专业用药建议"></textarea></div>
      <div class="modal-actions">
        <button class="btn" data-act="modal-close">取消</button>
        <button class="btn btn-primary" data-act="pha-reply-ok" data-id="${c.id}">提交回复</button>
      </div>`);
  },
  'pha-reply-ok': d => {
    closeModal();
    persist('/api/consult/' + d.id + '/reply', { reply: ($('#replyText') && $('#replyText').value) || '' }, '用药咨询已回复');
  },

  /* ---- 医保 ---- */
  'bill-upload': d => persist('/api/bill/' + d.id + '/upload', {}, '费用明细已实时上传医保平台'),
  'bill-audit': d => persist('/api/bill/' + d.id + '/audit', {}, '智能审核通过，目录匹配正常'),
  'bill-settle': d => persist('/api/bill/' + d.id + '/settle', {}, '结算完成，医保报销已回传'),
  'bill-receipt': d => {
    const b = state.bills.find(x => x.id === d.id);
    openModal(`
      <h3>电子票据</h3>
      <div class="summary">
        <div class="row"><span>票据号</span><b class="mono">${'FP' + b.id.slice(1)}</b></div>
        <div class="row"><span>患者</span><b>${b.patient}</b></div>
        <div class="row"><span>费用总额</span><b>¥${b.total.toFixed(2)}</b></div>
        <div class="row"><span>医保统筹支付</span><b style="color:var(--ok)">¥${b.ins.toFixed(2)}</b></div>
        <div class="row"><span>个人自付</span><b style="color:var(--danger)">¥${b.self.toFixed(2)}</b></div>
        <div class="row"><span>开票时间</span><b>${nowFull()}</b></div>
      </div>
      <div class="modal-actions"><button class="btn btn-primary" data-act="modal-close">关闭</button></div>`);
  },
  'catalog-toggle': d => persist('/api/catalog/' + d.code + '/toggle', {}, '目录状态已切换'),
  'anomaly-pass': d => persist('/api/anomaly/' + d.id + '/pass', {}, `异常费用 ${d.id} 已通过复核`),
  'anomaly-reject': d => persist('/api/anomaly/' + d.id + '/reject', {}, `异常费用 ${d.id} 已驳回`),

  /* ---- 患者 ---- */
  'pick-dept': d => {
    state.booking.dept = d.id;
    state.booking.doctor = null;
    state.booking.slot = null;
    render();
  },
  'pick-doctor': d => {
    state.booking.doctor = d.id;
    state.booking.slot = null;
    render();
  },
  'pick-date': d => { state.booking.dateIdx = +d.idx; state.booking.slot = null; render(); },
  'pick-slot': d => { state.booking.slot = d.slot; render(); },
  'pay': async () => {
    const b = state.booking;
    if (!b.doctor || b.slot === null) return toast('请先选择医生与就诊时段', 'warn');
    const doc = DOCTORS.find(d => d.id === b.doctor);
    const dates = dateLabels();
    const r = await api('POST', '/api/booking', {
      deptId: b.dept, doctorId: b.doctor, dateLabel: dates[b.dateIdx].label, slot: b.slot,
    });
    if (!r.ok) return toast(r.msg || '挂号失败', 'warn');
    state.lastAppt = Object.assign({}, r.appt, { no: 'A' + (state.queue.length + 1), code: 'HK' + Date.now().toString().slice(-10) });
    await loadData();
    render();
    toast('支付成功，号源已锁定');
  },
  'new-booking': () => {
    state.lastAppt = null;
    state.booking = { dept: null, doctor: null, dateIdx: 0, slot: null };
    render();
  },
  'pat-cancel': d => persist('/api/appt/' + d.id + '/cancel', {}, `预约 ${d.id} 已取消`),
  'pat-reschedule': d => {
    const a = state.patientAppts.find(x => x.id === d.id);
    toast(`改期申请已提交，客服将在 30 分钟内联系您`);
  },
  'pat-pay': d => persist('/api/paybill/' + d.id, {}, '支付成功，账单已更新'),
  'pat-read-all': () => persist('/api/pmessages/read-all', {}, '全部消息已标记为已读'),
  'pat-video': () => {
    toast('正在连接医生，请稍候…');
  },

  /* ---- 管理员 ---- */
  'adm-backup-now': () => persist('/api/backup', {}, '手动备份已完成'),
  'adm-refresh-api': () => persist('/api/refresh-api', {}, '接口数据已刷新'),
};

/* =========================================================
   事件绑定
   ========================================================= */
document.addEventListener('click', e => {
  const mask = e.target.closest('.modal-mask');
  const stop = e.target.closest('[data-stop]');
  if (mask && !stop) { closeModal(); return; }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'modal-close' && el.classList.contains('modal-mask')) return;
  const fn = ACTIONS[act];
  if (fn) { e.preventDefault(); fn(el.dataset); }
});

/* 表单输入实时写入状态（不触发重渲染，保持焦点） */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.form) {
    const f = getForm(t.dataset.form);
    f[t.dataset.field] = t.value;
  }
  if (t.id === 'emrSearch') {
    const q = t.value.trim().toLowerCase();
    $$('.rec-row').forEach(r => {
      r.style.display = (!q || r.dataset.text.toLowerCase().includes(q)) ? '' : 'none';
    });
  }
});

/* 登录 / 退出 / 回车登录 */
$('#logoutBtn').addEventListener('click', logout);
$('#loginBtn').addEventListener('click', doLogin);
$('#loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('#loginUser').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
/* 切换身份时提示对应账号 */
$('#loginRole').addEventListener('change', e => {
  const map = { '患者':'patient1', '医生':'doctor1', '护士':'nurse1', '药师':'pharma1', '医保人员':'insurance1', '系统管理员':'admin' };
  $('#loginUser').value = map[e.target.value] || '';
});

/* 时钟 */
function tickClock() {
  const d = new Date();
  const w = ['周日','周一','周二','周三','周四','周五','周六'];
  $('#clock').textContent = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${w[d.getDay()]} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
setInterval(tickClock, 1000);

/* =========================================================
   启动
   ========================================================= */
tickClock();
boot();
</script>
